<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CineTrack</h1>
        <input type="search" id="busca" name="busca" aria-label="Buscar filme">
        <button type="button" onclick="window.location.href='adicionar.html'">
            <span class="texto-curto">+</span>
            <span class="texto-completo">+ Adicionar</span>
        </button>
    </header>

    <nav aria-label="Filtros de status">
        <button type="button" class="ativo">Todos</button>
        <button type="button">Assistido</button>
        <button type="button">Assistindo</button>
        <button type="button">Quero assistir</button>
    </nav>

    <main>
        <section id="lista" aria-live="polite"></section>
    </main>

    <footer>
        <a href="adicionar.html">Adicionar filme</a>
        <a href="sobre.html">Sobre o CineTrack</a>
        <small id="total-filmes">CineTrack © 2026 · 6 filmes cadastrados.</small>
    </footer>

    <div id="modal" hidden>
        <div class="modal-conteudo">
            <h1>Adicionar filme</h1>

        <form id="form-filme">
            <div>
                <label for="titulo">Título</label><br>
                <input type="text" id="titulo" name="titulo" required>
            </div>
            <br>

            <div>
                <label for="ano">Ano</label><br>
                <input type="number" id="ano" name="ano" min="1888" max="2030" required>
            </div>
            <br>

            <div>
                <label for="genero">Gênero</label><br>
                <input type="text" id="genero" name="genero" required>
            </div>
            <br>

            <div>
                <label for="poster">URL do pôster</label><br>
                <input type="url" id="poster" name="poster">
            </div>
            <br>

            <div>
                <label for="status">Status</label><br>
                <select id="status" name="status" required>
                    <option value="Quero assistir">Quero assistir</option>
                    <option value="Assistindo">Assistindo</option>
                    <option value="Assistido">Assistido</option>
                </select>
            </div>
            <br>

            <div>
                <label for="nota">Nota (1 a 5)</label><br>
                <input type="number" id="nota" name="nota" min="1" max="5">
            </div>
            <br>

            <div>
                <label for="comentario">Comentário</label><br>
                <textarea id="comentario" name="comentario" rows="4" cols="40"></textarea>
            </div>
            <br>

            <div>
                <button type="button" onclick="window.location.href='index.html'">Cancelar</button>
                <button type="submit">Salvar</button>
            </div>
        </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
