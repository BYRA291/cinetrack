<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Organize os filmes que você assistiu ou quer assistir.">
    <title>CineTrack - Catálogo de Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CineTrack</h1>
        <label class="visualmente-oculto" for="busca">Buscar filme por título</label>
        <input type="search" id="busca" name="busca" placeholder="Buscar título" autocomplete="off">
        <button type="button" id="btn-adicionar">
            <span class="texto-curto">+</span>
            <span class="texto-completo">+ Adicionar</span>
        </button>
    </header>

    <nav aria-label="Filtros de status">
        <button type="button" class="ativo" data-status="todos" aria-pressed="true">Todos</button>
        <button type="button" data-status="assistido" aria-pressed="false">Assistido</button>
        <button type="button" data-status="assistindo" aria-pressed="false">Assistindo</button>
        <button type="button" data-status="quero" aria-pressed="false">Quero assistir</button>
        <label for="ordenar">Ordenar:</label>
        <select id="ordenar" name="ordenar">
            <option value="titulo">Título (A-Z)</option>
            <option value="ano">Ano (mais antigo)</option>
            <option value="nota">Nota (maior primeiro)</option>
        </select>
    </nav>

    <main>
        <section id="lista" aria-live="polite"></section>
    </main>

    <footer>
        <a href="adicionar.html">Adicionar filme</a>
        <a href="sobre.html">Sobre o CineTrack</a>
        <small id="total-filmes">CineTrack © 2026 · 6 filmes cadastrados.</small>
    </footer>

    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-modal" aria-describedby="instrucao-modal" hidden>
        <div class="modal-conteudo">
            <h1 id="titulo-modal">Adicionar filme</h1>
            <p id="instrucao-modal">Preencha os dados do filme. Campos obrigatórios estão identificados.</p>

        <form id="form-filme" novalidate>
            <div id="erros-form" role="alert" aria-live="assertive"></div>

            <div>
                <label for="titulo">Título (obrigatório)</label><br>
                <input type="text" id="titulo" name="titulo" required autocomplete="off">
            </div>
            <br>

            <div>
                <label for="ano">Ano (obrigatório)</label><br>
                <input type="number" id="ano" name="ano" min="1888" max="2030" required>
            </div>
            <br>

            <div>
                <label for="genero">Gênero (obrigatório)</label><br>
                <input type="text" id="genero" name="genero" required autocomplete="off">
            </div>
            <br>

            <div>
                <label for="poster">URL do pôster</label><br>
                <input type="url" id="poster" name="poster">
            </div>
            <br>

            <div>
                <label for="status">Status (obrigatório)</label><br>
                <select id="status" name="status" required>
                    <option value="quero">Quero assistir</option>
                    <option value="assistindo">Assistindo</option>
                    <option value="assistido">Assistido</option>
                </select>
            </div>
            <br>

            <div>
                <label for="nota">Nota (obrigatória, de 1 a 5)</label><br>
                <input type="number" id="nota" name="nota" min="1" max="5" required>
            </div>
            <br>

            <div>
                <label for="comentario">Comentário</label><br>
                <textarea id="comentario" name="comentario" rows="4" cols="40"></textarea>
            </div>
            <br>

            <div>
                <button type="button" id="btn-cancelar">Cancelar</button>
                <button type="submit">Salvar</button>
            </div>
        </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
