<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar filme - CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="index.html">&larr; Voltar</a>

    <h1>Adicionar filme</h1>

    <form id="form-filme">
        <div class="campo">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" required>
        </div>

        <div class="campo">
            <label for="ano">Ano</label>
            <input type="number" id="ano" name="ano" min="1888" max="2030" required>
        </div>

        <div class="campo">
            <label for="genero">Gênero</label>
            <input type="text" id="genero" name="genero" required>
        </div>

        <div class="campo">
            <label for="poster">URL do pôster</label>
            <input type="url" id="poster" name="poster">
        </div>

        <div class="campo">
            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="Quero assistir">Quero assistir</option>
                <option value="Assistindo">Assistindo</option>
                <option value="Assistido">Assistido</option>
            </select>
        </div>

        <div class="campo">
            <label for="nota">Nota (1 a 5)</label>
            <input type="number" id="nota" name="nota" min="1" max="5">
        </div>

        <div class="campo">
            <label for="comentario">Comentário</label>
            <textarea id="comentario" name="comentario" rows="4" cols="40"></textarea>
        </div>

        <div class="botoes-form">
            <button type="button" class="btn btn-secundario" onclick="window.location.href='index.html'">Cancelar</button>
            <button type="submit" class="btn btn-primario">Salvar</button>
        </div>
    </form>

</body>
</html>
